algorithms:
  global_planner_baseline:
    priorities: [same, index]
    params: ['ccr_1m.yaml', 'ccr_hex.yaml']
  global_planner_aco:
    planner_params_file: [planner_diffq.yaml, planner_aco.yaml]
    params: ['ccr_1m.yaml', 'ccr_hex.yaml']
  global_planner:
    quality_metric: ['criticality', 'flow']
    params: ['ccr_1m.yaml', 'ccr_hex.yaml']
modes:
  - fake
  - sim
n_robots: 5
n_runs: 3
run_timeout: 900.0
init_timeout: 60.0
waypoints_file: "icra2024_waypoints.yaml"
